name: GTK3 theme renderer smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 xvfb curl
      - name: Check Python syntax
        run: /usr/bin/python3 -m compileall -q tilomenu tests
      - name: Download original GnoMenu 2.9.1 themes
        run: |
          curl --fail --location --retry 2 --output /tmp/gnomenu-2.9.1.tar.gz             https://launchpad.net/gnomenu/trunk/2.9.1/+download/gnomenu-2.9.1.tar.gz
          mkdir -p /tmp/gnomenu-source
          tar -xzf /tmp/gnomenu-2.9.1.tar.gz -C /tmp/gnomenu-source --wildcards             'gnomenu/src/share/gnomenu/Themes/Menu/*'
      - name: Smoke test all 15 original themes under Xvfb
        env:
          PYTHONPATH: .
        run: |
          xvfb-run -a /usr/bin/python3 tests/smoke_themes.py             /tmp/gnomenu-source/gnomenu/src/share/gnomenu/Themes/Menu
