name: Direct GnoMenu source port checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python GI/GSettings dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libglib2.0-bin
      - name: Compile Python 3 source
        run: /usr/bin/python3 -m compileall -q src/lib/tilomenu src/bin
      - name: Check explicit GI namespace versions in all Python files
        run: /usr/bin/python3 tests/test_gi_versions.py
      - name: Compile GSettings schema
        run: glib-compile-schemas --strict src/share/glib-2.0/schemas
      - name: Preserve original class signatures and settings behavior
        env:
          GSETTINGS_SCHEMA_DIR: ${{ github.workspace }}/src/share/glib-2.0/schemas
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: /usr/bin/python3 tests/test_source_port.py

  original-gtk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install original Python/GI/GDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-xdg python3-dbus mate-menus gir1.2-gtk-3.0 gir1.2-matepanelapplet-4.0 libglib2.0-bin xvfb dbus-x11 curl make
      - name: Verify bundled original themes and install TiloMenu
        run: |
          make prepare
          sudo make install
      - name: Import original menu components using GTK3
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_gui_import.py
      - name: Test Gio application icons and fallback theme
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_icon_factory.py
      - name: Construct original 959-line settings window under GTK3
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_original_settings.py
      - name: Launch original settings as a separate GTK3 process
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_settings_subprocess.py
      - name: Construct original popup, then show/hide under GTK3
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_window_lifecycle.py

      - name: Connect original panel button to original popup
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_panel_popup.py

      - name: Construct original GTK2 program-list implementations under GTK3
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          for mode in 0 1 2 3 4; do
            echo "Original Prog_List mode ${mode}"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_program_list_modes.py "$mode" || exit 1
          done

      - name: Exercise original XDG menu special-page navigation
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_special_menus.py

      - name: Verify archived chrome and original theme transparency
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_theme_chrome.py

      - name: Construct original program context menu under GTK3
        env:
          GSETTINGS_BACKEND: memory
          XDG_MENU_PREFIX: mate-
        run: |
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_context_menu.py
